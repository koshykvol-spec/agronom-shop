<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Особистий кабінет — Агроном</title>
<meta name="description" content="Вхід у кабінет магазину Агроном — історія замовлень, дані профілю.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#2d6a2d">
<style>
.acc-wrap { max-width: 560px; margin: 24px auto; padding: 0 16px; }
.acc-card { background:#fff; border:1px solid #e6f0e6; border-radius:14px; padding:24px; text-align:center; }
.acc-title { font-size:1.3rem; font-weight:800; color:#1a3e1a; margin-bottom:6px; }
.acc-sub { color:#666; font-size:.92rem; margin-bottom:22px; }
.acc-login-buttons { display:flex; flex-direction:column; align-items:center; gap:14px; }
.acc-or { color:#aaa; font-size:.82rem; margin:2px 0; }
#tg-login-holder { display:flex; justify-content:center; }
.acc-profile { display:flex; flex-direction:column; align-items:center; gap:10px; }
.acc-avatar { width:72px; height:72px; border-radius:50%; object-fit:cover; background:#eef5ee; }
.acc-name { font-weight:800; font-size:1.1rem; color:#1a3e1a; }
.acc-logout { background:none; border:1px solid #ddd; color:#666; padding:8px 18px; border-radius:8px; cursor:pointer; font-size:.85rem; margin-top:4px; }
.acc-orders { margin-top:24px; text-align:left; }
.acc-orders h2 { font-size:1rem; font-weight:800; color:#1a3e1a; border-bottom:2px solid #e6f0e6; padding-bottom:8px; margin-bottom:12px; }
.order-card { border:1px solid #eee; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
.order-card .oc-head { display:flex; justify-content:space-between; font-weight:700; margin-bottom:4px; }
.order-card .oc-status { font-size:.78rem; padding:2px 9px; border-radius:12px; background:#eef5ee; color:#2d6a2d; font-weight:700; }
.order-card .oc-date { color:#999; font-size:.8rem; margin-bottom:6px; }
.order-card .oc-items { font-size:.86rem; color:#444; line-height:1.5; }
.acc-empty { color:#999; font-size:.9rem; text-align:center; padding:20px 0; }
.acc-loading { text-align:center; color:#999; padding:30px 0; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Перейти до вмісту</a>
<header><nav>
  <a href="/index.html" class="logo">АГРОНОМ</a>
  <a href="/protection_schemes.html" class="nav-link">🌿 Порадник</a>
  <a href="/account.html" class="nav-link" id="nav-account-link">👤 Кабінет</a>
  <div class="nav-right">
    <a href="tel:+380634625206" data-site-phone class="nav-phone">м. Володимир<br><strong>063 462 52 06</strong></a>
    <a href="tel:+380634625206" data-site-call class="nav-call" aria-label="Подзвонити в магазин">☎ Подзвонити</a>
  </div>
</nav></header>

<main id="main" class="acc-wrap">
  <div id="acc-loading" class="acc-loading">Завантаження…</div>

  <div id="acc-login" class="acc-card" style="display:none;">
    <div class="acc-title">Особистий кабінет</div>
    <div class="acc-sub">Увійдіть, щоб бачити історію своїх замовлень</div>
    <div class="acc-login-buttons">
      <div id="tg-login-holder"></div>
      <div class="acc-or">або</div>
      <div id="g_id_onload" data-callback="onGoogleAuth" data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="rectangular" data-logo_alignment="left"></div>
    </div>
  </div>

  <div id="acc-profile" class="acc-card" style="display:none;">
    <div class="acc-profile">
      <img id="acc-avatar" class="acc-avatar" src="" alt="" onerror="this.style.display='none'">
      <div id="acc-name" class="acc-name"></div>
      <button class="acc-logout" onclick="logout()">Вийти</button>
    </div>
    <div class="acc-orders">
      <h2>📦 Мої замовлення</h2>
      <div id="acc-orders-list"></div>
    </div>
  </div>
</main>

<nav class="bottom-nav" aria-label="Швидка навігація">
  <a href="/index.html" class="bn-item"><span class="bn-ico">📦</span><span class="bn-lbl">Каталог</span></a>
  <a href="/index.html" class="bn-item"><span class="bn-ico">🔍</span><span class="bn-lbl">Пошук</span></a>
  <a href="/index.html#cart" class="bn-item"><span class="bn-ico">🛒</span><span class="bn-lbl">Кошик</span></a>
  <a href="/account.html" class="bn-item active"><span class="bn-ico">👤</span><span class="bn-lbl">Кабінет</span></a>
  <a href="/contacts.html" class="bn-item"><span class="bn-ico">☎️</span><span class="bn-lbl">Контакти</span></a>
</nav>
<div id="site-footer"></div>

<script>
function esc(s){ var d=document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML; }

function initTelegramWidget(botUsername){
  if(!botUsername) return;
  var s = document.createElement('script');
  s.src = 'https://telegram.org/js/telegram-widget.js?22';
  s.setAttribute('data-telegram-login', botUsername);
  s.setAttribute('data-size', 'large');
  s.setAttribute('data-onauth', 'onTelegramAuth(user)');
  s.setAttribute('data-request-access', 'write');
  document.getElementById('tg-login-holder').appendChild(s);
}

function initGoogleButton(clientId){
  if(!clientId) return;
  document.getElementById('g_id_onload').setAttribute('data-client_id', clientId);
  var gs = document.createElement('script');
  gs.src = 'https://accounts.google.com/gsi/client';
  gs.async = true; gs.defer = true;
  document.head.appendChild(gs);
}

async function onTelegramAuth(user){
  try {
    const r = await fetch('/api/auth/telegram', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(user) });
    const d = await r.json();
    if(d.ok) location.reload(); else alert('Помилка входу: ' + (d.error||''));
  } catch(e){ alert('Помилка входу через Telegram'); }
}

async function onGoogleAuth(resp){
  try {
    const r = await fetch('/api/auth/google', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ credential: resp.credential }) });
    const d = await r.json();
    if(d.ok) location.reload(); else alert('Помилка входу: ' + (d.error||''));
  } catch(e){ alert('Помилка входу через Google'); }
}

async function logout(){
  try { await fetch('/api/auth/logout', { method:'POST' }); } catch(e){}
  location.reload();
}

function renderOrders(orders){
  var el = document.getElementById('acc-orders-list');
  if(!orders.length){ el.innerHTML = '<div class="acc-empty">Замовлень поки немає</div>'; return; }
  var STATUS_LABEL = { new:'Нове', processing:'В обробці', done:'Виконано', cancelled:'Скасовано' };
  el.innerHTML = orders.map(function(o){
    var itemsHtml = o.items.map(function(it){ return esc(it.n) + ' × ' + it.q; }).join('<br>');
    return '<div class="order-card">'
      + '<div class="oc-head"><span>Замовлення №' + esc(o.no) + '</span><span class="oc-status">' + esc(STATUS_LABEL[o.status] || o.status) + '</span></div>'
      + '<div class="oc-date">' + esc((o.created_at||'').slice(0,10)) + ' · ' + Number(o.total).toFixed(0) + ' грн</div>'
      + '<div class="oc-items">' + itemsHtml + '</div>'
      + '</div>';
  }).join('');
}

function loadScript(src){
  return new Promise(function(resolve){
    var sc = document.createElement('script'); sc.src = src;
    sc.onload = resolve; sc.onerror = resolve;
    document.head.appendChild(sc);
  });
}

async function boot(){
  // Спершу site-config (ставить window.SITE_CONFIG), тільки ПОТІМ footer.js —
  // footer.js читає window.SITE_CONFIG синхронно при старті, без очікування,
  // тому порядок тут критичний (інакше футер рендериться з порожніми даними).
  await loadScript('/site-config');
  var cfg = window.SITE_CONFIG || {};
  await loadScript('/footer.js');

  const meRes = await fetch('/api/auth/me').then(function(r){ return r.json(); }).catch(function(){ return {ok:false}; });
  document.getElementById('acc-loading').style.display = 'none';

  if(meRes.ok && meRes.customer){
    var navEl = document.getElementById('nav-account-link');
    if(navEl) navEl.textContent = '👤 ' + ((meRes.customer.name||'Кабінет').split(' ')[0]);
    document.getElementById('acc-profile').style.display = 'block';
    document.getElementById('acc-name').textContent = meRes.customer.name || 'Клієнт';
    if(meRes.customer.avatar){ document.getElementById('acc-avatar').src = meRes.customer.avatar; }
    else { document.getElementById('acc-avatar').style.display = 'none'; }
    const ordRes = await fetch('/api/account/orders').then(function(r){ return r.json(); }).catch(function(){ return {ok:false, orders:[]}; });
    renderOrders(ordRes.orders || []);
  } else {
    document.getElementById('acc-login').style.display = 'block';
    initTelegramWidget(cfg.tgLoginBotUsername);
    initGoogleButton(cfg.googleClientId);
  }
}
boot();
</script>
</body>
</html>
