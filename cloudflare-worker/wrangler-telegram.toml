name = "agro-telegram-poster"
main = "telegram-poster-worker.js"
compatibility_date = "2024-11-01"

# 09:00, 14:00, 19:00 за київським часом (UTC+3 влітку) = 06:00, 11:00, 16:00 UTC.
[triggers]
crons = ["0 6,11,16 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "agronom-db"
database_id = "b5d676d5-53a5-4b81-8888-4c77a967cf32"
