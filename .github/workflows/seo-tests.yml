name: SEO regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Без залежностей: офлайн-тести + «живі» перевірки на локальному імітаторі Pages
      - run: node tests/seo/run.mjs
